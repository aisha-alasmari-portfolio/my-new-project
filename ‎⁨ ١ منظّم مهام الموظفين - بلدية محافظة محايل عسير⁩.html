];

function Clock(){
 const [t,setT]=useState(new Date());
 useEffect(()=>{const i=setInterval(()=>setT(new Date()),1000);return()=>clearInterval(i)},[]);
 const h=t.getHours();
 return(<div className="text-center sm:text-start">
  <div className="text-3xl font-bold tabular-nums" dir="ltr">{t.toLocaleTimeString('en-GB')}</div>
  <div className="text-sm opacity-80">{t.toLocaleDateString('ar-SA',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
  <div className="text-xs opacity-70">{t.toLocaleDateString('ar-SA-u-ca-gregory',{day:'numeric',month:'long',year:'numeric'})} م · {h<12?"صباح الخير":"مساء الخير"}</div>
 </div>);
}

function Splash({onGo}){
 return(<div className="fixed inset-0 z-50 flex items-center justify-center p-6" style={{background:"#281C10"}}>
  <div className="text-center text-white max-w-sm">
   <img src={LOGO} alt="شعار بلدية محايل" className="mx-auto mb-6 h-28 w-auto rounded-2xl" style={{background:"#FCF3E4",padding:12}}/>

   <p className="mt-1 opacity-80">بلدية محافظة محايل عسير</p>
   <p className="mt-4 text-sm opacity-70 leading-7">أسندوا المهام، تابعوا الإنجاز، واعتمدوا الطلبات من مكان واحد.</p>
   <button onClick={onGo} className="mt-7 px-8 py-3 rounded-xl font-semibold" style={{background:"#FCF3E4",color:"#281C10"}}>ابدأ الآن</button>
  </div></div>);
}

function Toast({m}){return m?(<div className="fixed z-40 inset-x-0 bottom-24 flex justify-center px-4 pointer-events-none"><div className="toast px-5 py-3 rounded-xl text-white text-sm font-medium shadow-lg" style={{background:"#1d6b3a"}} role="status">{m}</div></div>):null}

function Stat({icon,label,v,c}){return(<div className="card p-4 flex items-center gap-3"><div className="w-11 h-11 rounded-xl flex items-center justify-center text-white" style={{background:c}}><Icon n={icon} s={22}/></div><div><div className="text-2xl font-bold tabular-nums">{v}</div><div className="text-xs mute">{label}</div></div></div>)}

function Manager({tasks,setTasks,reqs,setReqs,say}){
 const blank={emp:EMP[0],title:"",date:iso(1),time:"09:00",pri:"normal",type:TYPES[0],status:ST[0],details:""};
 const [f,setF]=useState(blank);
 const [fe,setFe]=useState("الكل");const [fs,setFs]=useState("الكل");
 const [editing,setEditing]=useState(null);const [txt,setTxt]=useState("");
 const set=(k,v)=>setF({...f,[k]:v});
 const send=e=>{e.preventDefault();if(!f.title.trim())return say("اكتب عنوان المهمة أولاً","#B3261E");
  setTasks([{...f,id:Date.now()},...tasks]);say("تم إرسال المهمة وتنبيه الموظف");setF(blank)};
 const setStatus=(id,s)=>{setTasks(tasks.map(t=>t.id===id?{...t,status:s}:t));say("تم تحديث حالة المهمة")};
 const act=(r,status)=>{if(r.ext&&status==="approved")setTasks(tasks.map(t=>t.id===r.ext?{...t,late:false}:t));setReqs(reqs.map(x=>x.id===r.id?{...x,status,managerNote:status==="edit"?txt:""}:x));
  say(status==="approved"?"تم اعتماد الطلب":status==="rejected"?"تم رفض الطلب":"تم إرسال طلب التعديل للموظف",status==="rejected"?"#B3261E":status==="edit"?"#E07B12":undefined);setEditing(null);setTxt("")};
 const pending=reqs.filter(r=>r.status==="pending").length;
 const list=tasks.filter(t=>(fe==="الكل"||t.emp===fe)&&(fs==="الكل"||t.status===fs)).sort(byTime);
 return(<div className="space-y-5">
  <div className="grid grid-cols-3 gap-3">
   <Stat icon="list" label="إجمالي المهام" v={tasks.length} c="#C66930"/>
   <Stat icon="clock" label="بانتظار الاعتماد" v={pending} c="#E07B12"/>

  </div>

    <label className="text-sm">نوع المهمة<select className="field mt-1" value={f.type} onChange={e=>set("type",e.target.value)}>{TYPES.map(n=><option key={n}>{n}</option>)}</select></label>
    <label className="text-sm">التاريخ<input type="date" className="field mt-1" value={f.date} onChange={e=>set("date",e.target.value)}/></label>
    <label className="text-sm">الوقت<input type="time" className="field mt-1" value={f.time} onChange={e=>set("time",e.target.value)}/></label>
   </div>
   <label className="text-sm block">المهمة<input className="field mt-1" placeholder="مثال: إعداد تقرير الصيانة الأسبوعي" value={f.title} onChange={e=>set("title",e.target.value)}/></label>
   <div className="text-sm">الأولوية
    <div className="grid grid-cols-3 gap-2 mt-1">{Object.entries(PRI).map(([k,p])=>
     <button type="button" key={k} onClick={()=>set("pri",k)} className="py-2 rounded-lg border text-sm font-medium" style={f.pri===k?{background:p.c,color:"#fff",borderColor:p.c}:{borderColor:"var(--line)",background:"var(--soft)"}}>{p.l} {p.e}</button>)}</div></div>
   <div className="text-sm">الحالة
    <div className="grid grid-cols-3 gap-2 mt-1">{ST.map(s=>
     <button type="button" key={s} onClick={()=>set("status",s)} className="py-2 rounded-lg border text-sm font-medium" style={f.status===s?{background:SC[s],color:"#fff",borderColor:SC[s]}:{borderColor:"var(--line)",background:"var(--soft)"}}>{s}</button>)}</div></div>
   <label className="text-sm block">تفاصيل المهمة<textarea rows="2" className="field mt-1" value={f.details} onChange={e=>set("details",e.target.value)} placeholder="تفاصيل إضافية للموظف (اختياري)"/></label>
   <button className="w-full py-3 rounded-xl text-white font-semibold flex items-center justify-center gap-2" style={{background:"var(--brand)"}}><Icon n="send"/>إرسال المهمة</button>
  </form>

    <label className="text-xs mute">الحالة<select className="field mt-1" value={fs} onChange={e=>setFs(e.target.value)}>{["الكل",...ST].map(n=><option key={n}>{n}</option>)}</select></label>
   </div>

 const ring=()=>{if(!muted)chime()};
 const toggleMute=()=>{const m=!muted;setMuted(m);if(!m)chime();say(m?"تم كتم الصوت":"تم تفعيل الصوت","#B05823")};
 const testSound=()=>muted?say("الصوت مكتوم. فعّله من أعلى الصفحة أولاً","#B3261E"):chime();
 const sim=()=>{if(alertOn||window.__sim)return;const t=tasks.filter(x=>x.emp===profile&&x.status!=="مكتملة").sort(byTime)[0];if(!t)return say("لا توجد مهمة مفتوحة للأستاذ "+profile+" لمحاكاتها","#B3261E");window.__sim=1;ring();setTimeout(()=>{window.__sim=0;setTasks(p=>p.map(x=>x.id===t.id?{...x,late:true}:x));setAlertId(t.id);setAlertOn(true)},muted?0:2300)};
 const alertInfo=()=>{const t=tasks.find(x=>x.id===alertId)||{emp:"",title:"",time:"09:00"};const kh=t.emp==="خالد";return{name:t.emp,title:t.title,time:kh?"09:00 AM":hm(t.time),clock:kh?"09:20 AM":hm(t.time,20)}};
 const deliver=()=>{setTasks(p=>p.map(x=>x.id===alertId?{...x,status:"مكتملة",late:false}:x));setAlertOn(false);say("تم التسليم وتحديث حالة المهمة إلى مكتملة")};
 const extend=()=>{const t=tasks.find(x=>x.id===alertId);if(t)setReqs(p=>[{id:Date.now(),emp:t.emp,title:"طلب تمديد موعد: "+t.title,note:"طلب الموظف تمديد الموعد بعد التأخر 20 دقيقة.",status:"pending",ext:t.id},...p]);setAlertOn(false);say("تم إرسال طلب التمديد إلى المدير","#E07B12")};
 const say=(m,c)=>{setToast({m,c});clearTimeout(window.__t);window.__t=setTimeout(()=>setToast(null),2600)};
 const isMgr=profile==="manager";const showDemo=!isMgr;const cur=isMgr?(view==="reports"?"reports":"manager"):"employee";const tabs=isMgr?[["manager","واجهة المدير","shield"],["reports","تقارير التجربة","chart"]]:[["employee","مهامي اليوم","user"]];
 return(<div>
  {splash&&<Splash onGo={()=>setSplash(false)}/>}
  {alertOn&&showDemo&&alertInfo().name===profile&&<DelayAlert a={alertInfo()} onDeliver={deliver} onExtend={extend}/>}
  <header style={{background:"#281C10"}} className="text-white"><div aria-hidden="true" className="flex h-1.5"><span className="flex-1" style={{background:"#EAB162"}}/><span className="flex-1" style={{background:"#C66930"}}/><span className="flex-1" style={{background:"#FCF3E4"}}/></div>
   <div className="max-w-4xl mx-auto px-4 pt-5 pb-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div className="flex items-center gap-3"><img src={LOGO} alt="شعار بلدية محايل" className="h-14 w-auto rounded-xl shrink-0" style={{background:"#FCF3E4",padding:6}}/>
     <div><div className="font-bold text-lg leading-tight">بلدية محافظة محايل عسير</div><div className="text-sm opacity-75">منظّم مهام الموظفين</div></div></div>
    <div className="flex items-center justify-between sm:justify-end gap-4"><Clock/><button onClick={toggleMute} aria-pressed={muted} className="px-3 py-2 rounded-xl bg-white/10 text-sm font-medium flex items-center gap-2"><Icon n={muted?"mute":"vol"} s={18}/>{muted?"الصوت مكتوم":"الصوت مفعّل"}</button></div>
   </div>
   <div className="max-w-4xl mx-auto px-4 pb-3"><label className="flex items-center gap-3 text-sm"><span className="shrink-0 opacity-80">الحساب الحالي</span><select aria-label="تحديد هوية المستخدم" className="field !w-auto flex-1 sm:flex-none sm:min-w-[14rem] !py-2 font-semibold" value={profile} onChange={e=>{setProfile(e.target.value);setView("manager");window.scrollTo(0,0)}}><option value="manager">واجهة المدير</option>{EMP.map(n=><option key={n} value={n}>{n}</option>)}</select></label></div>
   <nav className="max-w-4xl mx-auto px-4 flex gap-2">{tabs.map(([k,l,i])=>
    <button key={k} onClick={()=>setView(k)} className="flex-1 py-3 rounded-t-xl font-semibold flex items-center justify-center gap-2 text-sm" style={cur===k?{background:"var(--bg)",color:"var(--ink)"}:{color:"#fff",opacity:.8}}><Icon n={i}/>{l}</button>)}</nav>
  </header>
  <main className="max-w-4xl mx-auto px-4 py-5 pb-32">
   <button onClick={sim} className={(showDemo?"":"hidden ")+"w-full mb-5 py-2.5 rounded-xl border text-sm font-semibold flex items-center justify-center gap-2"} style={{borderColor:"#C62828",color:"#C62828",background:"var(--card)"}}><Icon n="alarm" s={18}/>{profile==="خالد"?"محاكاة تأخير الأستاذ خالد (الساعة 9:20)":"محاكاة تأخير الأستاذ "+profile}</button>
   <button onClick={testSound} className={"w-full mb-5 py-2.5 rounded-xl border text-sm font-semibold flex items-center justify-center gap-2"} style={{borderColor:"var(--line)",background:"var(--card)",marginTop:"-0.75rem"}}><Icon n="vol" s={18}/>تجربة نغمة التنبيه الصوتي</button>
   {cur==="manager"?<Manager {...{tasks,setTasks,reqs,setReqs,say}}/>:cur==="employee"?<Employee {...{tasks,setTasks,reqs,setReqs,say,ring,fixed:profile}}/>:<Reports {...{tasks,say}}/>}<Goals/>
  </main>
  <footer className="fixed bottom-0 inset-x-0 z-30 border-t" style={{background:"var(--card)",borderColor:"var(--line)",paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
   <div className="max-w-4xl mx-auto grid grid-cols-6 gap-1 px-2 py-2">{FEAT.map(([i,l,d])=>
    <button key={l} onClick={()=>say(d,"#B05823")} className="flex flex-col items-center gap-1 py-1 rounded-lg" style={{color:"#B05823"}} title={l}><span style={{color:"var(--ink)"}}><Icon n={i} s={20}/></span><span className="text-[10px] leading-tight text-center" style={{color:"var(--mute)"}}>{l}</span></button>)}</div>
  </footer>
  {toast&&<div className="fixed z-40 inset-x-0 bottom-24 flex justify-center px-4 pointer-events-none"><div className="toast px-5 py-3 rounded-xl text-white text-sm font-medium shadow-lg" style={{background:toast.c||"#1d6b3a"}} role="status">{toast.m}</div></div>}
 </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
